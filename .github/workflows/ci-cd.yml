name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Build Services
        run: |
          cd user-service && mvn clean package -DskipTests
          cd ../flight-service && mvn clean package -DskipTests
          cd ../booking-service && mvn clean package -DskipTests
          cd ../report-service && mvn clean package -DskipTests
          cd ../api-gateway && mvn clean package -DskipTests
          cd ../config-server && mvn clean package -DskipTests
          cd ../service-registry && mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # USER SERVICE
      - name: Build & Push User Service
        run: |
          docker build -t urmaliya2003/user-service ./user-service
          docker push urmaliya2003/user-service

      # FLIGHT SERVICE
      - name: Build & Push Flight Service
        run: |
          docker build -t urmaliya2003/flight-service ./flight-service
          docker push urmaliya2003/flight-service

      # BOOKING SERVICE
      - name: Build & Push Booking Service
        run: |
          docker build -t urmaliya2003/booking-service ./booking-service
          docker push urmaliya2003/booking-service

      # REPORT SERVICE
      - name: Build & Push Report Service
        run: |
          docker build -t urmaliya2003/report-service ./report-service
          docker push urmaliya2003/report-service

      # API GATEWAY
      - name: Build & Push API Gateway
        run: |
          docker build -t urmaliya2003/api-gateway ./api-gateway
          docker push urmaliya2003/api-gateway

      # CONFIG SERVER
      - name: Build & Push Config Server
        run: |
          docker build -t urmaliya2003/config-server ./config-server
          docker push urmaliya2003/config-server

      # EUREKA
      - name: Build & Push Service Registry
        run: |
          docker build -t urmaliya2003/service-registry ./service-registry
          docker push urmaliya2003/service-registry